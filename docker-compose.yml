# Local development: frontend + backend + ml-service with one command.
#   docker compose up --build backend frontend      → backend + frontend only (works before the ML models exist)
#   docker compose up --build                       → uses your Atlas cluster (backend/.env MONGODB_URI)
#   docker compose --profile local-db up --build    → also starts a local MongoDB; set
#                                                     MONGODB_URI=mongodb://mongo:27017/campuskart in backend/.env
# Before the first run: create backend/.env and ml-service/.env from their .env.example files,
# and train the ML models once (ml-service/docs/TRAINING_RUNBOOK.md) so ml-service/model_artifacts exists.
name: campuskart

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      AI_SERVICE_URL: http://ml-service:8000
      FRONTEND_URL: http://localhost:5173
    # Host port 5001: on macOS port 5000 is taken by AirPlay Receiver. Inside the container it is still 5000.
    # No depends_on ml-service: the marketplace runs without the AI service, so backend + frontend can start alone.
    ports: ["5001:5000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    env_file: ./ml-service/.env
    environment:
      APP_ENV: development
      PORT: 8000
      MODEL_STORAGE_ROOT: /app/model_artifacts
      PRICE_MODEL_PATH: /app/model_artifacts/price/current/model.joblib
      FRAUD_MODEL_PATH: /app/model_artifacts/fraud/current/model.joblib
    volumes:
      - ./ml-service/model_artifacts:/app/model_artifacts
    ports: ["8000:8000"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:5001/api # the browser calls the backend through the host port
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/app/src # hot reload
    depends_on: [backend]

  mongo:
    image: mongo:7
    profiles: ["local-db"]
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
