services:
  - type: web
    name: campuskart-ml
    runtime: docker
    plan: starter
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ML_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: MODEL_ARTIFACT_BUNDLE_URL
        sync: false
      - key: MODEL_ARTIFACT_BUNDLE_TOKEN
        sync: false
      - key: MODEL_STORAGE_ROOT
        value: /var/data/models
      - key: PRICE_MODEL_PATH
        value: /var/data/models/price/current/model.joblib
      - key: FRAUD_MODEL_PATH
        value: /var/data/models/fraud/current/model.joblib
    disk:
      name: campuskart-ml-data
      mountPath: /var/data
      sizeGB: 5

  # Node/Express backend (Deepakshi). Deploy order: ML service first (or skip it until the models are ready),
  # then this service, then the frontend on Vercel. See DEPLOYMENT.md.
  - type: web
    name: campuskart-backend
    runtime: docker
    plan: free # free instances sleep after ~15 min idle; switch to starter for the final demo
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production # also enables app.set("trust proxy", 1) for the rate limiter
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: campuskart
      - key: FRONTEND_URL
        sync: false # your Vercel URL, e.g. https://campuskart.vercel.app (comma-separate several)
      - key: AI_SERVICE_URL
        sync: false # the ML service URL, e.g. https://campuskart-ml.onrender.com
      - key: ML_API_KEY
        sync: false # same value as on campuskart-ml
      - key: HF_TOKEN
        sync: false
      - key: ANALYTICS_TZ
        value: Asia/Kolkata
