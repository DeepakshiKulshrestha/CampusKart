services:
  - type: web
    name: campuskart-ml
    runtime: docker
    plan: starter
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ML_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: MODEL_ARTIFACT_BUNDLE_URL
        sync: false
      - key: MODEL_ARTIFACT_BUNDLE_TOKEN
        sync: false
      - key: MODEL_STORAGE_ROOT
        value: /var/data/models
      - key: PRICE_MODEL_PATH
        value: /var/data/models/price/current/model.joblib
      - key: FRAUD_MODEL_PATH
        value: /var/data/models/fraud/current/model.joblib
    disk:
      name: campuskart-ml-data
      mountPath: /var/data
      sizeGB: 5
